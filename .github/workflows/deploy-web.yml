name: Build and Deploy El Forbrug to GitHub Pages (relay by FTP)

on:
  push:
    branches: [ "main" ]
    # Only the web app and what it is built from; changes to docs or tools don't redeploy.
    paths:
      - "ElForbrug.Web/**"
      - "ElForbrug.Core/**"
      - "Eloverblik/**"
      - "Stromligning/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # Also allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x # The project targets net10.0

      - name: Publish .NET App
        # The run number becomes the patch version (1.0.<run>), see ElForbrug.Web.csproj
        run: dotnet publish ElForbrug.Web/ElForbrug.Web.csproj -c Release -o release -p:BuildNumber=${{ github.run_number }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish-output
          path: release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-output
          path: release

      # The app itself is served from GitHub Pages (deploy-pages below). Pages cannot run PHP, so
      # only the relay api/eloverblik.php goes to this host, which must run PHP 8 with curl, plus a
      # page that sends old links on to Pages. Only changed files are sent, and files from earlier
      # runs that are no longer in relay-site/ are removed from the host.
      - name: Assemble relay site
        run: |
          mkdir -p relay-site
          cp -r release/wwwroot/api relay-site/api
          cat > relay-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="da">
          <head>
            <meta charset="utf-8">
            <title>El Forbrug er flyttet</title>
            <meta http-equiv="refresh" content="0; url=https://kreaton.github.io/ElForbrug/">
            <script>location.replace("https://kreaton.github.io/ElForbrug/" + location.search + location.hash);</script>
          </head>
          <body>
            <p>El Forbrug er flyttet til <a href="https://kreaton.github.io/ElForbrug/">kreaton.github.io/ElForbrug</a>.</p>
          </body>
          </html>
          EOF

      # Repository secrets (Settings > Secrets and variables > Actions):
      #   FTP_HOST      e.g. ftp.example.com
      #   FTP_USERNAME
      #   FTP_PASSWORD
      #   FTP_FOLDER    e.g. webroots/www/stromforbrug  (no trailing slash)
      - name: Deploy relay to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_FOLDER }}/
          local-dir: ./relay-site/

  # Publishes the app to https://kreaton.github.io/ElForbrug/ (Settings > Pages > Source: GitHub
  # Actions). It reaches Eloverblik through the relay on hejndorf.dk (wwwroot/appsettings.json).
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-output
          path: release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
